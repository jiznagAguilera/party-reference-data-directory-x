openapi: 3.0.0
info:
  title: party-reference-data-directory-x
  x-ibm-name: party-reference-data-directory-x
  description: API Party Reference Data Directory X
  version: 1.0.0
servers:
  - url: /x/v1.0/partyreferencedatadirectory
paths:
  /associations/corporate/retrieve/{PersonIdentification}/{PersonIdentificationType}/{ServiceType}:
    get:
      description: >-
        Permite mediante un código IBS del cliente permita consultar al
        ejecutivo de negocio en el origen de datos de IBS
      operationId: RetrieveCustomerProductandServiceDirectoryProduct
      parameters:
        - name: PersonIdentification
          in: path
          description: Número de documento
          required: true
          schema:
            type: string
        - name: PersonIdentificationType
          in: path
          description: Tipo de documento
          required: true
          schema:
            type: string
        - name: ServiceType
          in: path
          description: Código del servicio
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/RetrievePartyReferenceDataDirectoryAssociationsCorporateResponse
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - PartyReferenceDataDirectory_Associations_Corporate_Retrieve
  /entry/natural/retrieve/{ServiceType}/{CustomerReference}:
    get:
      description: >-
        Servicio el cual permita la consulta de datos del clientes en la base de
        datos del IBS
      operationId: RetrievePartyReferenceDataDirectoryEntryNatural
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/RetrievePartyReferenceDataDirectoryEntryNaturalResponse
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      parameters:
        - name: ServiceType
          in: path
          description: Código que invocará al Resolutor para ejecutar un RPG en específico
          required: true
          schema:
            type: string
        - name: CustomerReference
          in: path
          description: Codigo de cliente IBS
          required: true
          schema:
            type: string
      security:
        - oAuth:
            - PartyReferenceDataDirectory_Entry_Natural_Retrieve
  /reference/natural/retrieve:
    post:
      description: >-
        Servicio que permita la consulta de código de cliente IBS mediante el
        tipo y numero de documento
      operationId: RetrievePartyReferenceDataDirectoryReferenceNatural
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/RetrievePartyReferenceDataDirectoryReferenceNatural
        required: true
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/RetrievePartyReferenceDataDirectoryReferenceNaturalResponse
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - PartyReferenceDataDirectory_Reference_Natural_Retrieve
  /entry/natural/register:
    post:
      description: >-
        Permite mediante un código IBS del cliente permita consultar al
        ejecutivo de negocio en el origen de datos de IBS
      operationId: RegisterPartyReferenceDataDirectoryEntryNatural
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/RegisterPartyReferenceDataDirectoryEntryNatural
        required: true
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/RegisterPartyReferenceDataDirectoryEntryNaturalResponse
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - PartyReferenceDataDirectory_Entry_Natural_Register
  /reference/natural/update:
    put:
      description: >-
        Servicio que permita la actualización de datos del cliente en la base de
        datos del IBS
      operationId: UpdatePartyReferenceDataDirectoryReferenceNatural
      requestBody:
        content:
          application/json:
            schema:
              $ref: >-
                #/components/schemas/UpdatePartyReferenceDataDirectoryReferenceNatural
        required: true
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/UpdatePartyReferenceDataDirectoryReferenceNaturalResponse
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - PartyReferenceDataDirectory_Reference_Natural_Update
  /referenceregisteredplin/natural/retrieve/{ContactReference}/{DestinationWalletName}:
    get:
      description: >-
        Permite obtener el nombre registrado en la billetera indicada del número
        destino Plin de un cliente PN
      operationId: RetrievePartyReferenceDataDirectoryReferenceRegisteredPlinNatural
      parameters:
        - name: ContactReference
          in: path
          description: Número de contacto destino
          required: true
          schema:
            type: string
        - name: DestinationWalletName
          in: path
          description: Billetera del contacto destino
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/RetrievePartyReferenceDataDirectoryReferenceRegisteredPlinNaturalResponse
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - >-
              PartyReferenceDataDirectory_ReferenceRegisteredPlin_Natural_Retrieve
  /healthcheck:
    get:
      description: >-
        Permite consultar el cronograma de préstamo de un cliente persona
        natural
      operationId: HealthCheck
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - Healthcheck
