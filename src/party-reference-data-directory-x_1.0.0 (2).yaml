     responseType = 'error';\r\n    } else if (responseValue && responseValue !== '00' && statusCodeBus == '200') {\r\n        responseType = 'warn';\r\n    } else if (statusCodeBus == '500') {\r\n        responseType = 'internal';\r\n    } else if (statusCodeBus == '400') {\r\n        responseType = 'error';\r\n    } \r\n    \r\n    var customHeaders = {\r\n        'ApiResponseCode': responseMessages[responseType].code,\r\n        'ApiResponseMessage': responseMessages[responseType].message,\r\n        'Cache-Control': 'no-store',\r\n        'Content-Security-Policy': 'none',\r\n        'X-Content-Type-Options': 'nosniff',\r\n        'X-Frame-Options': 'DENY',\r\n        'HttpCode': statusCodeBus,\r\n        'HttpMessage': statusMessageBus,\r\n        'TimeStamp': getTimeStamp(),\r\n        'X-Correlation-Id': context.request.header.get('x-correlation-id') || generateRandomUUID(),\r\n        'X-Request-Id': generateRandomUUID(),\r\n        'Access-Control-Allow-Headers': 'Origin, Content-Type, Accept',\r\n        'Access-Control-Allow-Methods': 'POST, GET, PUT',\r\n        'Strict-Transport-Security' : 'max-age=15552000'\r\n    };\r\n\r\n    var responseHeaders = context.get('current.headers') || {};\r\n    \r\n    responseHeaders['Content-Type'] = 'application/json';\r\n\r\n    for (var headerName in customHeaders) {\r\n        responseHeaders[headerName] = customHeaders[headerName];\r\n    }\r\n\r\n    header_meta.current.headers = responseHeaders;\r\n\r\n    context.set('message.status.code', statusCodeBus);\r\n    context.set('message.status.reason', statusMessageBus);\r\n}\r\n\r\nsetResponseHeaders(context);"
