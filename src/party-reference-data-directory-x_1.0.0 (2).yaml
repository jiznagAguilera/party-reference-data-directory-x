                              'error': {
                                  code: '01',
                                  message: 'La solicitud posee una sintaxis incorrecta o falta parametro(s) requerido(s)'
                              },
                              'warn': {
                                  code: '02',
                                  message: 'La solicitud ha generado un evento inusual'
                              },
                              'internal': {
                                  code: '03',
                                  message: 'Se ha producido un error interno en el servidor'
                              },
                              'success': {
                                  code: '00',
                                  message: 'Ejecución Exitosa'
                              },
                              'timeout': {
                                  code: '03',
                                  message: 'Ocurrio un error de timeout con el backend'
                              }
                          };

                      let responseType = 'internal';

                      let isBadRequestByHeaders = false;


                      // Evaluación de errores por encabezados

                      if (missingHeadersListAudit && missingHeadersListAudit !==
                      'false') {
                          responseType = 'error';
                          statusCodeBus = 400;
                          statusMessageBus = 'Bad Request';
                          isBadRequestByHeaders = true;
                      } else if (incorrectFormat && incorrectFormat !== 'false')
                      {
                          responseType = 'error';
                      } else if (String(statusCodeBus) === '200') {
                          if (['00', '0'].includes(responseValue)) {
                              responseType = 'success';
                          } else {
                              responseType = 'warn';
                          }
                      } else if (String(statusCodeBus) === '504') {
                          responseType = 'timeout';
                          statusCodeBus = 504; // ← Esto es clave
                          statusMessageBus = 'Gateway Timeout';
                      }


                      // Recalcular el string después de posibles reasignaciones

                      const statusCodeStr = String(statusCodeBus);


                      // Forzar 500 si no es 200, 400 (por encabezados) o 504

                      if (!['200', '504'].includes(statusCodeStr) &&
                      !isBadRequestByHeaders) {
                          statusCodeBus = 500;
                          statusMessageBus = 'Internal Server Error';
                      }


                          const customHeaders = {
                              'ApiResponseCode': responseMessages[responseType].code,
                              'ApiResponseMessage': responseMessages[responseType].message,
                              'Cache-Control': 'no-store',
