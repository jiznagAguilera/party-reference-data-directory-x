                    source: "\r\n\r\nfunction applyTemplate(template, variables) {\r\n\r\n\r\n  return template.replace(/{(\\w+)}/g, (_, key) => variables[key] ?? `{${key}}`);\r\n}\r\n\r\n\r\nfunction validateStringField(value, fieldName, exactLength, minLength, maxLength, allowSpecialChars = false, isRequired = true) {\r\n    const errorMessages = [];\r\n\r\n    value = value ?? \"\";\r\n\r\n    if (typeof value !== 'string') {\r\n        errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-cadena'), {\r\n            headerName: fieldName\r\n        }));\r\n    } else if (isRequired && value.trim().length === 0) {\r\n        errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), {\r\n            headerName: fieldName\r\n        }));\r\n    }\r\n\r\n    if (exactLength !== null && exactLength !== undefined) {\r\n        if (value.length !== exactLength) {\r\n            errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-exacta'), {\r\n                headerName: fieldName,\r\n                exactLength: exactLength\r\n            }));\r\n        }\r\n    } else {\r\n        const valueLength = value.length;\r\n        if (valueLength < minLength || valueLength > maxLength) {\r\n            errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {\r\n                headerName: fieldName,\r\n                minLength: minLength,\r\n                maxLength: maxLength\r\n            }));\r\n        }\r\n    }\r\n\r\n    if (!allowSpecialChars) {\r\n        const specialCharRegex = /[!@#$%^&*(),.?\":{}|<>]/;\r\n        if (specialCharRegex.test(value)) {\r\n            errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-caracteres-especiales'), {\r\n                headerName: fieldName\r\n            }));\r\n        }\r\n    }\r\n\r\n    return errorMessages.length > 0 ? errorMessages : null;\r\n}\r\n\r\n\r\nfunction validateNumberField(value, fieldName, minLength, maxLength, exactLength = null) {\r\n    const errorMessages = [];\r\n\r\n    if (typeof value !== 'number') {\r\n        errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-numero'), {\r\n            headerName: fieldName\r\n        }));\r\n    } else if (!Number.isInteger(value)) {\r\n        errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-numero-entero'), {\r\n            headerName: fieldName\r\n        }));\r\n    }\r\n\r\n    const valueLength = value.toString().length;\r\n\r\n    if (exactLength !== null && valueLength !== exactLength) {\r\n        errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-exacta'), {\r\n            headerName: fieldName,\r\n            exactLength: exactLength\r\n        }));\r\n    } else if (valueLength < minLength || valueLength > maxLength) {\r\n        errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {\r\n            headerName: fieldName,\r\n            minLength: minLength,\r\n            maxLength: maxLength\r\n        }));\r\n    }\r\n\r\n    return errorMessages.length > 0 ? errorMessages : null;\r\n}\r\n\r\n\r\nfunction validateRequestBody() {\r\n    var missingFields = [];\r\n    \r\n    var userId = context.request.headers['UserId'] ?? context.request.headers['userid'] ;\r\n    var branchCode = context.request.headers['BranchCode'] ?? context.request.headers['branchcode'];\r\n    var countryCode = context.request.headers['CountryCode'] ?? context.request.headers['countrycode'];\r\n    var deviceId = context.request.headers['DeviceId'] ?? context.request.headers['deviceid'];\r\n    var content = context.request.headers['Content-Type'] || context.request.headers['content-type'] || \"\";\r\n\r\n    var serviceType = context.get('request.parameters.ServiceType.values');\r\n    var customerReference = context.get('request.parameters.CustomerReference.values');\r\n\r\n    let error;\r\n    \r\n    serviceType = String(serviceType);\r\n    customerReference = String(customerReference);\r\n\r\nif (!content) {\r\n    missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), {\r\n        headerName: \"Content-Type\"\r\n    }));\r\n} else {\r\n    error = validateStringField(content, \"Content-Type\", null, 15, 16);\r\n    if (error) missingFields.push(error);\r\n}\r\n\r\nif (userId !== undefined && userId !== null) {\r\n    error = validateStringField(userId ?? \"\", \"UserId\", null, 0, 10, false, false);\r\n    if (error?.length > 0) missingFields.push(...error);\r\n}\r\n\r\nif (branchCode !== undefined && branchCode !== null) {\r\n    error = validateStringField(branchCode ?? \"\", \"BranchCode\", null, 5, 30, false, false);\r\n    if (error?.length > 0) missingFields.push(...error);\r\n}\r\n\r\nif (countryCode !== undefined && countryCode !== null) {\r\n    error = validateStringField(countryCode ?? \"\", \"CountryCode\", null, 5, 30, false, false);\r\n    if (error?.length > 0) missingFields.push(...error);\r\n}\r\n\r\nif (deviceId !== undefined && deviceId !== null) {\r\n    error = validateStringField(deviceId ?? \"\", \"DeviceId\", null, 5, 30, false, false);\r\n    if (error?.length > 0) missingFields.push(...error);\r\n}\r\n\r\nif (!serviceType || serviceType.trim() === \"\" || serviceType === \":ServiceType\") {\r\n    missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), {\r\n        headerName: \"ServiceType\"\r\n    }));\r\n} else {\r\n    error = validateStringField(serviceType, \"ServiceType\", 6, null, null);\r\n    if (error) missingFields.push(error);\r\n}\r\n\r\nif (!customerReference || customerReference.trim() === \"\" || customerReference === \":CustomerReference\") {\r\n    missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), {\r\n        headerName: \"CustomerReference\"\r\n    }));\r\n} else {\r\n    customerReference = Number(customerReference);\r\n\r\n    if (isNaN(customerReference)) {\r\n        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-numero'), {\r\n            headerName: \"CustomerReference\"\r\n        }));\r\n    } else {\r\n        error = validateNumberField(customerReference, \"CustomerReference\", 1, 9);\r\n        if (error) missingFields.push(error);\r\n    }\r\n}\r\n\r\n    return missingFields;\r\n}\r\n\r\nfunction handleErrorResponse(errors) {\r\n    if (!errors || errors.length === 0) return;\r\n\r\n    const response = {\r\n        StatusCode: context.get('api.properties.prop-msg-codigo-error-400'),\r\n        Message: context.get('api.properties.prop-msg-mensaje-error-400'),\r\n        Status: context.get('api.properties.prop-msg-status-error')\r\n    };\r\n\r\n    context.set('missingHeadersListAudit', errors.join(', '));\r\n    context.set('message.body', JSON.stringify(response));\r\n    context.set('message.status.code', parseInt(context.get('api.properties.prop-http-status-400'), 10));\r\n    context.set('message.status.reason', context.get('api.properties.prop-http-reason-400'));\r\n    context.message.header.set('Content-Type', context.get('api.properties.prop-content-type-json'));\r\n}\r\n\r\ncontext.request.body.readAsJSON(function (error, requestBody) {\r\n    if (error) {\r\n        context.reject('BadRequestError', 'Input is not a valid JSON document');\r\n        return;\r\n    }\r\n    \r\n    context.set('analytics-backend',context.get('request.verb')+context.get('api.properties.prop-app-name-app')+context.get('api.properties.prop-url-ace-facility-list'));\r\n    const missingFields = validateRequestBody(requestBody);\r\n    handleErrorResponse(missingFields);\r\n});"
