                - gatewayscript:
                    version: 2.0.0
                    title: GSValidate
                    source: >-
                      function applyTemplate(template, variables) {
                        return template.replace(/{(\w+)}/g, (_, key) => variables[key] ?? `{${key}}`);
                      }

                      function validateStringField(value, fieldName,
                      exactLength, minLength, maxLength, allowSpecialChars =
                      false, isRequired = true) {
                        const errorMessages = [];

                        value = value ?? "";

                        if (typeof value !== 'string') {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-cadena'), { headerName: fieldName }));
                        } else if (isRequired && value.trim().length === 0) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: fieldName }));
                        }

                        if (exactLength !== null && exactLength !== undefined) {
                          if (value.length !== exactLength) {
                            errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-exacta'), {
                              headerName: fieldName,
                              exactLength
                            }));
                          }
                        } else {
                          const valueLength = value.length;
                          if (valueLength < minLength || valueLength > maxLength) {
                            errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {
                              headerName: fieldName,
                              minLength,
                              maxLength
                            }));
                          }
                        }

                        if (!allowSpecialChars) {
                          const specialCharRegex = /[!@#$%^&*(),.?":{}|<>]/;
                          if (specialCharRegex.test(value)) {
                            errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-caracteres-especiales'), { headerName: fieldName }));
                          }
                        }

                        return errorMessages.length > 0 ? errorMessages : null;
                      }


                      function validateDecimalField(value, fieldName, minLength,
                      maxLength) {
                        const errorMessages = [];

                        const valueString = value.toString();
                        const [integerPart, decimalPart] = valueString.split('.');
                        const totalLength = integerPart.length + (decimalPart ? decimalPart.length : 0);

                        if (typeof value !== 'number') {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-numero'), { headerName: fieldName }));
                        }

                        if (totalLength < minLength || totalLength > maxLength) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {
                            headerName: fieldName,
                            minLength,
                            maxLength
                          }));
                        }

                        if (decimalPart && decimalPart.length > 2) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango-decimales-parte-entera'), {
                            headerName: fieldName,
                            minInt: integerPart.length,
                            maxInt: integerPart.length
                          }));
                        }

                        return errorMessages.length > 0 ? errorMessages : null;
                      }



                      function validateDecimalFieldNoLimit(value, fieldName,
                      minLength, maxLength) {
                        const errorMessages = [];

                        const valueString = value.toString();
                        const [integerPart, decimalPart] = valueString.split('.');
                        const totalLength = integerPart.length + (decimalPart ? decimalPart.length : 0);

                        if (typeof value !== 'number') {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-numero'), { headerName: fieldName }));
                        }

                        if (totalLength < minLength || totalLength > maxLength) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {
                            headerName: fieldName,
                            minLength,
                            maxLength
                          }));
                        }

                        return errorMessages.length > 0 ? errorMessages : null;
                      }



                      function validateList(value, fieldName, minLength,
                      maxLength) {
                        const errorMessages = [];

                        if (!Array.isArray(value)) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-cadena'), { headerName: fieldName }));
                        } else if (value.length === 0) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: fieldName }));
                        } else {
                          if (value.length < minLength || value.length > maxLength) {
                            errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {
                              headerName: fieldName,
                              minLength,
                              maxLength
                            }));
                          }

                          for (let i = 0; i < value.length; i++) {
                            if (typeof value[i] !== 'number' || !Number.isInteger(value[i])) {
                              errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-numero-entero'), { headerName: `${fieldName} - posición ${i + 1}` }));
                            }

                            const valueLength = value[i].toString().length;
                            if (valueLength < minLength || valueLength > maxLength) {
                              errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {
                                headerName: `${fieldName} - posición ${i + 1}`,
                                minLength,
                                maxLength
                              }));
                            }
                          }
                        }

                        return errorMessages.length > 0 ? errorMessages : null;
                      }



                      function validateList(value, fieldName, minLength,
                      maxLength) {
                        const errorMessages = [];

                        if (!Array.isArray(value)) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-cadena'), { headerName: fieldName }));
                        } else if (value.length === 0) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: fieldName }));
                        } else {
                          if (value.length < minLength || value.length > maxLength) {
                            errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {
                              headerName: fieldName,
                              minLength,
                              maxLength
                            }));
                          }

                          for (let i = 0; i < value.length; i++) {
                            if (typeof value[i] !== 'number' || !Number.isInteger(value[i])) {
                              errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-numero-entero'), { headerName: `${fieldName} - posición ${i + 1}` }));
                            }

                            const valueLength = value[i].toString().length;
                            if (valueLength < minLength || valueLength > maxLength) {
                              errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {
                                headerName: `${fieldName} - posición ${i + 1}`,
                                minLength,
                                maxLength
                              }));
                            }
                          }
                        }

                        return errorMessages.length > 0 ? errorMessages : null;
                      }



                      function validateListDecimalRango(value, fieldName,
                      minLength, maxLength, minValue, maxValue) {
                        const errorMessages = [];

                        if (!Array.isArray(value)) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-numero'), { headerName: fieldName }));
                        } else if (value.length === 0) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: fieldName }));
                        } else {
                          if (value.length < minLength || value.length > maxLength) {
                            errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {
                              headerName: fieldName,
                              minLength,
                              maxLength
                            }));
                          }

                          for (let i = 0; i < value.length; i++) {
                            const item = value[i];
                            const itemLabel = `${fieldName} - posición ${i + 1}`;

                            if (typeof item !== 'number') {
                              errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-numero'), {
                                headerName: itemLabel
                              }));
                              continue;
                            }

                            if (item < minValue || item > maxValue) {
                              errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-error-enum'), {
                                headerName: itemLabel
                              }));
                            }

                            const [entero, decimal] = item.toString().split(".");
                            if (entero.length > 7) {
                              errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango-decimales-parte-entera'), {
                                headerName: itemLabel,
                                minInt: 0,
                                maxInt: 7
                              }));
                            }

                            if (decimal && decimal.length > 2) {
                              errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango-decimales-parte-entera'), {
                                headerName: itemLabel,
                                minInt: 0,
                                maxInt: 2
                              }));
                            }
                          }
                        }

                        return errorMessages.length > 0 ? errorMessages : null;
                      }



                      function validateNumberField(value, fieldName, minLength,
                      maxLength, exactLength = null) {
                        const errorMessages = [];

                        if (typeof value !== 'number') {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-numero'), { headerName: fieldName }));
                        } else if (!Number.isInteger(value)) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-tipo-dato-numero-entero'), { headerName: fieldName }));
                        }

                        const valueLength = value.toString().length;

                        if (exactLength !== null && valueLength !== exactLength) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-exacta'), {
                            headerName: fieldName,
                            exactLength
                          }));
                        } else if (valueLength < minLength || valueLength > maxLength) {
                          errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {
                            headerName: fieldName,
                            minLength,
                            maxLength
                          }));
                        }

                        return errorMessages.length > 0 ? errorMessages : null;
                      }




                      function validateRequestBody(requestBody) {

                        var missingFields = [];

                        var userId = context.request.headers['UserId'] ?? context.request.headers['userid'];
                        var branchCode = context.request.headers['BranchCode'] ?? context.request.headers['branchcode'];
                        var countryCode = context.request.headers['CountryCode'] ?? context.request.headers['countrycode'];
                        var deviceId = context.request.headers['DeviceId'] ?? context.request.headers['deviceid'];
                        var content = context.request.headers['Content-Type'] || context.request.headers['content-type'] || "";

                        var serviceType = requestBody.RetrieveConsumerLoanSimulation?.ServiceType;
                        var loanProductType = requestBody.RetrieveConsumerLoanSimulation?.LoanProductType;
                        var loanProductIdentifier = requestBody.RetrieveConsumerLoanSimulation?.LoanProductIdentifier;
                        var instructionDate = requestBody.RetrieveConsumerLoanSimulation?.InstructionDate;
                        var currencyCode = requestBody.RetrieveConsumerLoanSimulation?.CurrencyCode;
                        var loanAmount = requestBody.RetrieveConsumerLoanSimulation?.LoanAmount;
                        var numberOfInstalment = requestBody.RetrieveConsumerLoanSimulation?.NumberOfInstalment;
                        var instalmentPlanType = requestBody.RetrieveConsumerLoanSimulation?.InstalmentPlanType;
                        var doubleInstalmentMonthList = requestBody.RetrieveConsumerLoanSimulation?.DoubleInstalmentMonth;

                        var loanDisbursementDate = requestBody.RetrieveConsumerLoanSimulation?.LoanDisbursementDate;
                        var paymentDay = requestBody.RetrieveConsumerLoanSimulation?.PaymentDay;
                        var gracePeriod = requestBody.RetrieveConsumerLoanSimulation?.GracePeriod;
                        var rateValue = requestBody.RetrieveConsumerLoanSimulation?.RateValue;
                        var taxValue = requestBody.RetrieveConsumerLoanSimulation?.TaxValue;
                        var issuranceValue = requestBody.RetrieveConsumerLoanSimulation?.IssuranceValue;
                        var insuredAmount = requestBody.RetrieveConsumerLoanSimulation?.InsuredAmount;
                        var assetValue = requestBody.RetrieveConsumerLoanSimulation?.AssetValue;
                        var instructionAmount = requestBody.RetrieveConsumerLoanSimulation?.InstructionAmount;
                        var documentServiceRequest = requestBody.RetrieveConsumerLoanSimulation?.DocumentServiceRequest;
                        var commissionAmountList = requestBody.RetrieveConsumerLoanSimulation?.CommissionAmount;

                        var arrangementAction = requestBody.RetrieveConsumerLoanSimulation?.ArrangementAction;
                        var insurancePartyRole = requestBody.RetrieveConsumerLoanSimulation?.InsurancePartyRole;

                        let error;

                      if (!content) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "Content-Type" }));
                      } else {
                        error = validateStringField(content, "Content-Type", null, 15, 16);
                        if (error) missingFields.push(error);
                      }


                      if (userId !== undefined && userId !== null) {
                        error = validateStringField(userId ?? "", "UserId", null, 0, 10, false, false);
                        if (error?.length > 0) missingFields.push(...error);
                      }


                      if (branchCode !== undefined && branchCode !== null) {
                        error = validateStringField(branchCode ?? "", "BranchCode", null, 5, 30, false, false);
                        if (error?.length > 0) missingFields.push(...error);
                      }


                      if (countryCode !== undefined && countryCode !== null) {
                        error = validateStringField(countryCode ?? "", "CountryCode", null, 5, 30, false, false);
                        if (error?.length > 0) missingFields.push(...error);
                      }


                      if (deviceId !== undefined && deviceId !== null) {
                        error = validateStringField(deviceId ?? "", "DeviceId", null, 5, 30, false, false);
                        if (error?.length > 0) missingFields.push(...error);
                      }


                      if (!serviceType) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "ServiceType" }));
                      } else {
                        error = validateStringField(serviceType, "ServiceType", null, 3, 6);
                        if (error) missingFields.push(error);
                      }


                      if (!loanProductType) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "LoanProductType" }));
                      } else {
                        error = validateStringField(loanProductType, "LoanProductType", null, 3, 4, true);
                        if (error) missingFields.push(error);
                      }


                      if (!loanProductIdentifier) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "LoanProductIdentifier" }));
                      } else {
                        error = validateStringField(loanProductIdentifier, "LoanProductIdentifier", 4, 4, 4, true);
                        if (error) missingFields.push(error);
                      }


                      if (!instructionDate) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "InstructionDate" }));
                      } else {
                        error = validateStringField(instructionDate, "InstructionDate", 8, null, null);
                        if (error) missingFields.push(error);
                      }


                      if (!currencyCode) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "CurrencyCode" }));
                      } else {
                        error = validateStringField(currencyCode, "CurrencyCode", null, 1, 3, true);
                        if (error) missingFields.push(error);
                      }


                      if (!loanAmount) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "LoanAmount" }));
                      } else {
                        error = validateDecimalField(loanAmount, "LoanAmount", 2, 11);
                        if (error) missingFields.push(error);
                      }


                      if (!numberOfInstalment) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "NumberOfInstalment" }));
                      } else {
                        error = validateNumberField(numberOfInstalment, "NumberOfInstalment", 1, 3);
                        if (error) missingFields.push(error);
                      }


                      if (!instalmentPlanType) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "InstalmentPlanType" }));
                      } else {
                        error = validateStringField(instalmentPlanType, "InstalmentPlanType", 1, null, null);
                        if (error) missingFields.push(error);
                      }


                      if (!doubleInstalmentMonthList) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "DoubleInstalmentMonth" }));
                      } else {
                        doubleInstalmentMonthList = Array.isArray(doubleInstalmentMonthList) ? doubleInstalmentMonthList : [doubleInstalmentMonthList];
                        error = validateList(doubleInstalmentMonthList, "DoubleInstalmentMonth", 1, 2);
                        if (error) missingFields.push(error);
                      }


                      if (!loanDisbursementDate) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "LoanDisbursementDate" }));
                      } else {
                        error = validateNumberField(loanDisbursementDate, "LoanDisbursementDate", 8, 8, 8);
                        if (error) missingFields.push(error);
                      }


                      if (!paymentDay) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "PaymentDay" }));
                      } else {
                        error = validateNumberField(paymentDay, "PaymentDay", 1, 2);
                        if (error) missingFields.push(error);
                      }


                      if (gracePeriod) {
                        error = validateNumberField(gracePeriod, "GracePeriod", 0, 1);
                        if (error) missingFields.push(error);
                      }


                      if (!rateValue) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "RateValue" }));
                      } else {
                        error = validateDecimalFieldNoLimit(rateValue, "RateValue", 6, 9);
                        if (error) missingFields.push(error);
                      }


                      if (taxValue) {
                        error = validateDecimalFieldNoLimit(taxValue, "TaxValue", 6, 9);
                        if (error) missingFields.push(error);
                      }


                      if (issuranceValue) {
                        error = validateDecimalFieldNoLimit(issuranceValue, "IssuranceValue", 6, 9);
                        if (error) missingFields.push(error);
                      }


                      if (insuredAmount) {
                        error = validateDecimalField(insuredAmount, "InsuredAmount", 2, 11);
                        if (error) missingFields.push(error);
                      }


                      if (assetValue) {
                        error = validateDecimalField(assetValue, "AssetValue", 2, 11);
                        if (error) missingFields.push(error);
                      }


                      if (instructionAmount) {
                        error = validateDecimalField(instructionAmount, "InstructionAmount", 1, 5);
                        if (error) missingFields.push(error);
                      }


                      if (!documentServiceRequest) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "DocumentServiceRequest" }));
                      } else {
                        error = validateStringField(documentServiceRequest, "DocumentServiceRequest", 1, null, null);
                        if (error) missingFields.push(error);
                      }


                      if (!commissionAmountList) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "CommissionAmount" }));
                      } else {
                        commissionAmountList = Array.isArray(commissionAmountList) ? commissionAmountList : [commissionAmountList];
                        error = validateListDecimalRango(commissionAmountList, "commissionAmount", 1, 3, 10, 9999999.99);
                        if (error) missingFields.push(error);
                      }


                      if (arrangementAction) {
                        error = validateStringField(arrangementAction, "ArrangementAction", 1, null, null, true);
                        if (error) missingFields.push(error);
                      }


                      if (!insurancePartyRole) {
                        missingFields.push(applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: "InsurancePartyRole" }));
                      } else {
                        error = validateStringField(insurancePartyRole, "InsurancePartyRole", null, 3, 8, true);
                        if (error) missingFields.push(error);
                      }

                        return missingFields;
                      }




                      function handleErrorResponse(errors) {
                          if (!errors || errors.length === 0) return;

                          const response = {
                              StatusCode: context.get('api.properties.prop-msg-codigo-error-400'),
                              Message: context.get('api.properties.prop-msg-mensaje-error-400'),
                              Status: context.get('api.properties.prop-msg-status-error')
                          };

                          context.set('missingHeadersListAudit', errors.join(', '));
                          context.set('message.body', JSON.stringify(response));
                          context.set('message.status.code', parseInt(context.get('api.properties.prop-http-status-400'), 10));
                          context.set('message.status.reason', context.get('api.properties.prop-http-reason-400'));
                          context.message.header.set('Content-Type', context.get('api.properties.prop-content-type-json'));
                      }


                      context.request.body.readAsJSON(function (error,
                      requestBody) {
                          if (error) {
                              context.reject('BadRequestError', 'Input is not a valid JSON document');
                              return;
                          }
                          
                          context.set('analytics-backend',context.get('request.verb')+context.get('api.properties.prop-app-name-app')+context.get('api.properties.prop-url-ace-simulation'));
                          const missingFields = validateRequestBody(requestBody);
                          handleErrorResponse(missingFields);
                      });
                - switch:
                    version: 2.0.0
                    title: switch
                    case:
                      - condition: missingHeadersListAudit = 'false'
                        execute:
