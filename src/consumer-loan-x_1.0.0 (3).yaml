                    source: "function getTimeStamp() {\r\n    let systemTime = new Date();\r\n    systemTime = new Date(systemTime.getTime() - (3600 * 5000));\r\n\r\n    let year = systemTime.getFullYear();\r\n    let month = String(systemTime.getMonth() + 1).padStart(2, '0');\r\n    let day = String(systemTime.getDate()).padStart(2, '0');\r\n    let hours = String(systemTime.getHours()).padStart(2, '0');\r\n    let minutes = String(systemTime.getMinutes()).padStart(2, '0');\r\n    let seconds = String(systemTime.getSeconds()).padStart(2, '0');\r\n    let milliseconds = String(systemTime.getMilliseconds()).padStart(3, '0');\r\n\r\n    return `${year}${month}${day} ${hours}${minutes}${seconds}${milliseconds}`;\r\n\r\n    //return systemTime.toISOString().replace(/T/, ' ').replace(/Z/, '');\r\n    \r\n}\r\n\r\nfunction generateRandomUUID() {\r\n    var randomUUID = (\r\n        Math.random().toString(16).substr(2, 8) + '-' +\r\n        Math.random().toString(16).substr(2, 4) + '-' +\r\n        '4' + Math.random().toString(16).substr(2, 3) + '-' +\r\n        (Math.random().toString(16).substr(2, 1) & 0x3 | 0x8).toString(16) + Math.random().toString(16).substr(2, 3) + '-' +\r\n        Math.random().toString(16).substr(2, 12)\r\n    );\r\n    \r\n    return randomUUID;\r\n}\r\n\r\nvar responseHealthCheck = {\r\n    \"Time-Stamp\": getTimeStamp(),\r\n    \"X-Correlation-Id\": context.request.header.get('x-correlation-id') || generateRandomUUID(),\r\n    \"Check\": true\r\n};\r\n\r\nvar responseBody = JSON.stringify(responseHealthCheck);\r\ncontext.set('message.body', responseBody);\r\n"
