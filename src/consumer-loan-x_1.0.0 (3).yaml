openapi: 3.0.0
info:
  title: consumer-loan-x
  x-ibm-name: consumer-loan-x
  description: API Service Domain Consumer Loan
  version: 1.0.0
servers:
  - url: /x/v1.0/consumerloan
paths:
  /facility/retrieve:
    post:
      description: >-
        Permite consultar el cronograma de préstamo de un cliente persona
        natural
      operationId: RetrieveConsumerLoanFacility
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveConsumerLoanFacility'
        required: true
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveConsumerLoanFacilityResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - ConsumerLoan_Facility_Retrieve
  /simulation/retrieve:
    post:
      description: Simulación de un préstamo para persona natural (PN)
      operationId: RetrieveConsumerLoanSimulation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RetrieveConsumerLoanSimulation'
        required: true
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveConsumerLoanSimulationResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - ConsumerLoan_Simulation_Retrieve
  /facilitydetail/retrieve/{ServiceType}/{LoanNumber}:
    get:
      description: Permite obtener  el detalle de los Préstamos  de una persona natural.
      operationId: RetrieveConsumerLoanFacilityDetail
      parameters:
        - name: LoanNumber
          in: path
          description: Código que invocará al Resolutor para ejecutar un RPG en específico
          required: true
          schema:
            type: string
        - name: ServiceType
          in: path
          description: Código que invocará al Resolutor para ejecutar un RPG en específico
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/RetrieveConsumerLoanFacilityDetailResponse
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - ConsumerLoan_FacilityDetail_Retrieve
  /facility/proposal/update:
    put:
      description: >-
        Actualizar el estado de la propuesta de crédito para un cliente persona
        natural
      operationId: UpdateConsumerLoanFacilityProposal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConsumerLoanFacilityProposal'
        required: true
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: >-
                  #/components/schemas/UpdateConsumerLoanFacilityProposalResponse
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - ConsumerLoan_FacilityProposal_Update
  /facilitylist/retrieve/{ServiceType}/{CustomerReference}:
    get:
      description: Consultar Listado de los Préstamos de un cliente persona natural.
      operationId: RetrieveConsumerLoanFacilityList
      parameters:
        - name: ServiceType
          in: path
          description: Código que invocará al Resolutor para ejecutar un RPG en específico
          required: true
          schema:
            type: string
        - name: CustomerReference
          in: path
          description: Codigo del cliente IBS
          required: true
          schema:
            type: string
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RetrieveConsumerLoanFacilityListResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - ConsumerLoan_FacilityList_Retrieve
  /healthcheck:
    get:
      description: >-
        Permite consultar el cronograma de préstamo de un cliente persona
        natural
      operationId: HealthCheck
      responses:
        '200':
          description: The operation was successful.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheckResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExceptionResponse'
      security:
        - oAuth:
            - Healthcheck
