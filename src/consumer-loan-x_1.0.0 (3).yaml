                - gatewayscript:
                    version: 2.0.0
                    title: GSValidate
                    source: "\r\n\r\nfunction applyTemplate(template, variables) {\r\n\r\n\r\n  return template.replace(/{(\\w+)}/g, (_, key) => variables[key] ?? `{${key}}`);\r\n}\r\n\r\n\r\nfunction validateStringField(value, fieldName, isRequired, minLength, maxLength, allowSpecialChars = true) {\r\n  if (!isRequired && (value === null || value === undefined)) {\r\n    return;\r\n  }\r\n\r\n\r\n  if (isRequired && (value === null || value === undefined)) {\r\n\r\n    return [applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: fieldName })];\r\n  }\r\n\r\n  if (typeof value !== 'string') {\r\n    return [applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-cadena'), { headerName: fieldName })];\r\n  }\r\n\r\n  const errorMessages = [];\r\n\r\n  if (!allowSpecialChars && /[!@#$%^&*(),.?\":{}|<>]/.test(value)) {\r\n    errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-caracteres-especiales'), { headerName: fieldName }));\r\n\r\n  }\r\n\r\n  if (minLength == null || minLength == undefined || maxLength == null || maxLength == undefined) {\r\n    return;\r\n  }\r\n\r\n  if ((minLength === maxLength && value.length !== maxLength) || (value.length < minLength || value.length > maxLength)) {\r\n    if (minLength === maxLength) {\r\n      errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-exacta'), {\r\n        headerName: fieldName,\r\n        exactLength: maxLength\r\n      }));\r\n    } else {\r\n\r\n      errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {\r\n        headerName: fieldName,\r\n        minLength: minLength,\r\n        maxLength: maxLength\r\n      }));\r\n    }\r\n  }\r\n\r\n  return errorMessages.length ? errorMessages : null;\r\n}\r\n\r\nfunction validateNumericField(value, fieldName, isRequired, minLength, maxLength) {\r\n  if (!isRequired && (value === null || value === undefined)) {\r\n    return;\r\n  }\r\n\r\n  if (isRequired && (value === null || value === undefined)) {\r\n    return [applyTemplate(context.get('api.properties.prop-msg-campo-obligatorio'), { headerName: fieldName })];\r\n  }\r\n\r\n  //  Validación estricta de tipo: solo se acepta number\r\n  if (typeof value !== 'number') {\r\n    return [\r\n      applyTemplate(\r\n        context.get('api.properties.prop-msg-tipo-dato-incorrecto-numero'),\r\n        { headerName: fieldName }\r\n      )\r\n    ];\r\n  }\r\n\r\n  const valueAsNumber = Number(value);\r\n\r\n  if (isNaN(valueAsNumber)) {\r\n    return [applyTemplate(context.get('api.properties.prop-msg-tipo-dato-incorrecto-numero'), { headerName: fieldName })];\r\n  }\r\n  if ((!Number.isInteger(valueAsNumber) || (typeof value === 'string' && value.includes('.')))) {\r\n    return [applyTemplate(context.get('api.properties.prop-msg-tipo-dato-numero-entero'), { headerName: fieldName })];\r\n  }\r\n\r\n  if (!/^\\d+$/.test(String(value))) {\r\n    return [applyTemplate(context.get('api.properties.prop-msg-tipo-dato-numero-entero'), { headerName: fieldName })];\r\n  }\r\n\r\n\r\n\r\n  const errorMessages = [];\r\n\r\n  const valuelength = String(value).length;\r\n\r\n  if (!minLength || !maxLength) {\r\n    return;\r\n  }\r\n\r\n  if (\r\n    (minLength === maxLength && valuelength !== maxLength) ||\r\n    (valuelength < minLength || valuelength > maxLength)\r\n  ) {\r\n    if (minLength === maxLength) {\r\n      errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-exacta'), {\r\n        headerName: fieldName,\r\n        exactLength: maxLength\r\n      }));\r\n    } else {\r\n      errorMessages.push(applyTemplate(context.get('api.properties.prop-msg-longitud-incorrecta-rango'), {\r\n        headerName: fieldName,\r\n        minLength: minLength,\r\n        maxLength: maxLength\r\n      }));\r\n    }\r\n  }\r\n\r\n  return errorMessages.length ? errorMessages : null;\r\n}\r\n\r\n\r\n\r\n\r\n\r\nfunction validateRequestBody(requestBody) {\r\n  const errors = [];\r\n\r\n  const headers = context.request.headers;\r\n  const userId = headers['UserId'] ?? headers['userid'];\r\n  const branchCode = headers['BranchCode'] ?? headers['branchcode'];\r\n  const countryCode = headers['CountryCode'] ?? headers['countrycode'];\r\n  const deviceId = headers['DeviceId'] ?? headers['deviceid'];\r\n  const contentType = headers['Content-Type'] ?? headers['content-type'];\r\n\r\n  let error;\r\n\r\n  var serviceType = requestBody.RetrieveConsumerLoanFacility?.ServiceType;\r\n  var statusCode = requestBody.RetrieveConsumerLoanFacility?.StatusCode;\r\n  var numberOfRecordsReturn = requestBody.RetrieveConsumerLoanFacility?.NumberOfRecordsReturn;\r\n  var numberOfPage = requestBody.RetrieveConsumerLoanFacility?.NumberOfPage;\r\n  var loanNumber = requestBody.RetrieveConsumerLoanFacility?.LoanNumber;\r\n\r\n  // Headers\r\n  error = validateStringField(contentType, \"Content-Type\", true, 15, 16);\r\n  if (error) errors.push(...error);\r\n\r\n  error = validateStringField(userId, \"UserId\", true, 1, 10);\r\n  if (error) errors.push(...error);\r\n\r\n  error = validateStringField(branchCode, \"BranchCode\", false, 5, 30);\r\n  if (error) errors.push(...error);\r\n\r\n  error = validateStringField(countryCode, \"CountryCode\", false, 5, 30);\r\n  if (error) errors.push(...error);\r\n\r\n  error = validateStringField(deviceId, \"DeviceId\", false, 5, 30);\r\n  if (error) errors.push(...error);\r\n\r\n  // Body\r\n  error = validateStringField(statusCode, \"StatusCode\", true, 1, 1);\r\n  if (error) errors.push(...error);\r\n\r\n  error = validateStringField(serviceType, \"ServiceType\", true, 6, 6);\r\n  if (error) errors.push(...error);\r\n\r\n  error = validateNumericField(numberOfRecordsReturn, \"NumberOfRecordsReturn\", true, 1, 5);\r\n  if (error) errors.push(...error);\r\n\r\n  error = validateNumericField(numberOfPage, \"NumberOfPage\", true, 1, 5);\r\n  if (error) errors.push(...error);\r\n\r\n  error = validateNumericField(loanNumber, \"LoanNumber\", true, 9, 12);\r\n  if (error) errors.push(...error);\r\n\r\n  return errors;\r\n}\r\n\r\n\r\n\r\nfunction handleErrorResponse(errors) {\r\n    if (!errors || errors.length === 0) return;\r\n\r\n    const response = {\r\n        StatusCode: context.get('api.properties.prop-msg-codigo-error-400'),\r\n        Message: context.get('api.properties.prop-msg-mensaje-error-400'),\r\n        Status: context.get('api.properties.prop-msg-status-error')\r\n    };\r\n\r\n    context.set('missingHeadersListAudit', errors.join(', '));\r\n    context.set('message.body', JSON.stringify(response));\r\n    context.set('message.status.code', parseInt(context.get('api.properties.prop-http-status-400'), 10));\r\n    context.set('message.status.reason', context.get('api.properties.prop-http-reason-400'));\r\n    context.message.header.set('Content-Type', context.get('api.properties.prop-content-type-json'));\r\n}\r\n\r\ncontext.request.body.readAsJSON(function (error, requestBody) {\r\n    if (error) {\r\n        context.reject('BadRequestError', 'Input is not a valid JSON document');\r\n        return;\r\n    }\r\n    \r\n    context.set('analytics-backend',context.get('request.verb')+context.get('api.properties.prop-app-name-app')+context.get('api.properties.prop-target-url-ace'));\r\n    const missingFields = validateRequestBody(requestBody);\r\n    handleErrorResponse(missingFields);\r\n});"
