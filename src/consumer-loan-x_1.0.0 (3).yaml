                    source: "let header_meta = require('header-metadata');\r\n\r\nvar url = context.get('api.properties.prop-target-url-ace');\r\nvar backendName = 'POST|APP213|' + url;\r\ncontext.set('nameback_1', backendName);\r\n\r\nfunction getTimeStamp() {\r\n    let systemTime = new Date();\r\n    systemTime = new Date(systemTime.getTime() - (3600 * 5000));\r\n    return systemTime.toISOString();\r\n    \r\n}\r\n\r\nfunction generateRandomUUID() {\r\n    var randomUUID = (\r\n        Math.random().toString(16).substr(2, 8) + '-' +\r\n        Math.random().toString(16).substr(2, 4) + '-' +\r\n        '4' + Math.random().toString(16).substr(2, 3) + '-' +\r\n        (Math.random().toString(16).substr(2, 1) & 0x3 | 0x8).toString(16) + Math.random().toString(16).substr(2, 3) + '-' +\r\n        Math.random().toString(16).substr(2, 12)\r\n    );\r\n    \r\n    return randomUUID;\r\n}\r\n\r\nfunction setResponseHeaders(context) {\r\n    let missingHeadersListAudit = context.get('missingHeadersListAudit');\r\n    let incorrectFormat = context.get('incorrectFormat');\r\n    let responseValue = context.get('responseValue');\r\n\r\n    const responseMessages = {\r\n        'error': {\r\n            code: '01',\r\n            message: 'La solicitud posee una sintaxis incorrecta o falta parametro(s) requerido(s)'\r\n        },\r\n        'warn': {\r\n            code: '02',\r\n            message: 'La solicitud ha generado un evento inusual'\r\n        },\r\n        'internal': {\r\n            code: '03',\r\n            message: 'Se ha producido un error interno en el servidor'\r\n        },\r\n        'success': {\r\n            code: '00',\r\n            message: 'Ejecución Exitosa'\r\n        }\r\n    };\r\n\r\n    let responseType = 'success'; \r\n\r\n    if (missingHeadersListAudit && missingHeadersListAudit !== 'false') {\r\n        responseType = 'error';\r\n    } else if (incorrectFormat && incorrectFormat !== 'false') {\r\n        responseType = 'error';\r\n    } else if (responseValue && responseValue == '02') {\r\n        responseType = 'warn';\r\n    } else if (responseValue && (responseValue == '201' || responseValue == '202')) {\r\n        responseType = 'error';\r\n    }\r\n\r\n     let statusCode, statusReason;\r\n    if (responseType === 'success' || responseType === 'warn') {\r\n        statusCode = 200;\r\n        statusReason = 'OK';\r\n    } else if (responseType === 'error') {\r\n        statusCode = 400;\r\n        statusReason = 'Bad Request';\r\n    } else if (responseType === 'internal') {\r\n        statusCode = 500;\r\n        statusReason = 'Internal Server Error';\r\n    }\r\n\r\n    var customHeaders = {\r\n        'ApiResponseCode': responseMessages[responseType].code,\r\n        'ApiResponseMessage': responseMessages[responseType].message,\r\n        'Cache-Control': 'no-store',\r\n        'Content-Security-Policy': 'none',\r\n        'X-Content-Type-Options': 'nosniff',\r\n        'X-Frame-Options': 'DENY',\r\n        'HttpCode': statusCode,\r\n        'HttpMessage': statusReason,\r\n        'TimeStamp': getTimeStamp(),\r\n        'X-Correlation-Id': context.request.header.get('x-correlation-id') || generateRandomUUID(),\r\n        'X-Request-Id': generateRandomUUID(),\r\n        'Access-Control-Allow-Headers': 'Origin, Content-Type, Accept',\r\n        'Access-Control-Allow-Methods': 'POST, GET, PUT',\r\n        'Strict-Transport-Security' : 'max-age=15552000'\r\n    };\r\n\r\n    var responseHeaders = context.get('current.headers') || {};\r\n    \r\n    responseHeaders['Content-Type'] = 'application/json';\r\n\r\n    for (var headerName in customHeaders) {\r\n        responseHeaders[headerName] = customHeaders[headerName];\r\n    }\r\n\r\n    header_meta.current.headers = responseHeaders;\r\n\r\n    context.set('message.status.code', statusCode);\r\n    context.set('message.status.reason', statusReason);\r\n}\r\n\r\nsetResponseHeaders(context);"
                - log:
