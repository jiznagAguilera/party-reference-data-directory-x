or) missingFields.push(error);\r\n    }\r\n\r\n    if (userId !== undefined && userId !== null) {\r\n        error = validateStringField(userId ?? \"\", \"UserId\", null, 0, 10, false, false);\r\n        if (error?.length > 0) missingFields.push(...error);\r\n    }\r\n\r\n    if (branchCode !== undefined && branchCode !== null) {\r\n        error = validateStringField(branchCode ?? \"\", \"BranchCode\", null, 5, 30, false, false);\r\n        if (error?.length > 0) missingFields.push(...error);\r\n    }\r\n\r\n    if (countryCode !== undefined && countryCode !== null) {\r\n        error = validateStringField(countryCode ?? \"\", \"CountryCode\", null, 5, 30, false, false);\r\n        if (error?.length > 0) missingFields.push(...error);\r\n    }\r\n\r\n    if (deviceId !== undefined && deviceId !== null) {\r\n        error = validateStringField(deviceId ?? \"\", \"DeviceId\", null, 5, 30, false, false);\r\n        if (error?.length > 0) missingFields.push(...error);\r\n    }\r\n\r\n    return missingFields;\r\n}\r\n\r\nfunction handleErrorResponse(errors) {\r\n    if (!errors || errors.length === 0) return;\r\n\r\n    const response = {\r\n        StatusCode: context.get('api.properties.prop-msg-codigo-error-400'),\r\n        Message: context.get('api.properties.prop-msg-mensaje-error-400'),\r\n        Status: context.get('api.properties.prop-msg-status-error')\r\n    };\r\n\r\n    context.set('missingHeadersListAudit', errors.join(', '));\r\n    context.set('message.body', JSON.stringify(response));\r\n    context.set('message.status.code', parseInt(context.get('api.properties.prop-http-status-400'), 10));\r\n    context.set('message.status.reason', context.get('api.properties.prop-http-reason-400'));\r\n    context.message.header.set('Content-Type', context.get('api.properties.prop-content-type-json'));\r\n}\r\n\r\ncontext.request.body.readAsJSON(function (error, requestBody) {\r\n    if (error) {\r\n        context.reject('BadRequestError', 'Input is not a valid JS